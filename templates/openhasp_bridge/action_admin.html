<form action="?" method="post" class="form-horizontal">
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_ENDPOINT#></label><input type="text" name="endpoint" value="[#ENDPOINT#]" class="form-control"></div>
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_METHOD#></label><select name="method" class="form-control"><option value="GET"[#if METHOD="GET"#] selected[#endif#]>GET</option><option value="POST"[#if METHOD="POST"#] selected[#endif#]>POST</option></select></div>
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_TOKEN#></label><input type="password" name="token" value="" class="form-control" autocomplete="new-password"></div>
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_REGION#></label><input type="text" name="region" value="[#REGION#]" class="form-control"></div>
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_TRACKING#></label><input type="text" name="tracking" value="[#TRACKING#]" class="form-control"></div>
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_PAYLOAD#></label><textarea name="payload" rows="4" class="form-control">[#PAYLOAD#]</textarea></div>
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_DEVICE_NAME#></label><input type="text" name="device_name" value="[#DEVICE_NAME#]" class="form-control"></div>
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_OBJECT_ID#></label><input type="text" name="object_id" value="[#OBJECT_ID#]" class="form-control"></div>
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_PROPERTY#></label><input type="text" name="property" value="[#PROPERTY#]" class="form-control"></div>
 <div class="form-group"><label><#LANG_OPENHASP_BRIDGE_PAGE#></label><input type="text" name="page" value="[#PAGE#]" class="form-control"></div>
 <button type="submit" class="btn btn-primary"><#LANG_UPDATE#></button>
 <input type="hidden" name="mode" value="update">
</form>
<p class="help-block"><#LANG_OPENHASP_BRIDGE_HINT#></p>
<p class="help-block"><#LANG_OPENHASP_BRIDGE_LAST#>: [#LAST_RESULT#]</p>
